<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cafe Food Menu</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <section class="w-full min-h-screen bg-[#F9E6CD] 
    flex flex-col lg:flex-row justify-evenly items-center 
    px-3 sm:px-5 py-8 gap-5 overflow-hidden">


        <div class="w-full lg:w-[38%] p-3 sm:p-5 flex flex-col gap-8">

            <div>

                <div class="text-center mb-5">
                    <h2 class="text-[#262917] text-2xl sm:text-3xl
                    lg:text-4xl font-semibold animate-pulse">
                        Indian Snaks
                    </h2>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">


                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 ease-in-out
                    hover:scale-105 hover:shadow-xl">

                        <img src="image/masala-papad.png" alt="Masala Papad"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            Masala Papad
                        </h4>

                        <span class="font-bold block text-center">249</span>
                    </div>

                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105
                    hover:shadow-xl">

                        <img src="image/samosa.avif" alt="Samosa" class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            Samose
                        </h4>

                        <span class="font-bold block text-center">129</span>
                    </div>


                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105
                    hover:shadow-xl">

                        <img src="image/alootikki.jpg" alt="Aloo Tikki"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            Aloo Tikki
                        </h4>

                        <span class="font-bold block text-center">129</span>
                    </div>

                </div>
            </div>


            <div>

                <div class="text-center mb-5">
                    <h2 class="text-[#262917] text-2xl sm:text-3xl
                    lg:text-4xl font-semibold animate-pulse">
                        Cakes & Desserts
                    </h2>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">

                    <!-- Card 1 -->
                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/spacial cake.jpg" alt="Velvet Crescent"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm text-center mt-2">
                            Velvet Crescent
                        </h4>

                        <span class="font-bold block text-center">250</span>
                    </div>


                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/truffle.avif" alt="Chocolate Truffle"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm text-center mt-2">
                            Chocolate Truffle
                        </h4>

                        <span class="font-bold block text-center">199</span>
                    </div>

                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/rainbow.jpg" alt="Rainbow Cake"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm text-center mt-2">
                            Rainbow Cake
                        </h4>

                        <span class="font-bold block text-center">229</span>
                    </div>

                </div>
            </div>

        </div>



        <div class="w-full lg:w-[38%] p-3 sm:p-5
        flex flex-col gap-8">


            <div>

                <div class="text-center mb-5">
                    <h2 class="text-[#262917] text-2xl sm:text-3xl
                    lg:text-4xl font-semibold animate-pulse">
                        Fast Food
                    </h2>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">

                    <!-- Card 1 -->
                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/fries.jpg" alt="French Fries"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            French Fries
                        </h4>

                        <span class="font-bold block text-center">149</span>
                    </div>

                    <!-- Card 2 -->
                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/pizza.jpg" alt="Veg Pizza" class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            Veg Pizza
                        </h4>

                        <span class="font-bold block text-center">249</span>
                    </div>


                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/burger.jpg" alt="Cheese Burger"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            Cheese Burger
                        </h4>

                        <span class="font-bold block text-center">350</span>
                    </div>

                </div>
            </div>



            <div>

                <div class="text-center mb-5">
                    <h2 class="text-[#262917] text-2xl sm:text-3xl
                    lg:text-4xl font-semibold animate-pulse">
                        Beverages
                    </h2>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">


                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/masala chay.jpg" alt="Masala Chay"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            Masala Chay
                        </h4>

                        <span class="font-bold block text-center">199</span>
                    </div>


                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/cold coffe.jpg" alt="Cold Coffee"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            Cold Coffe
                        </h4>

                        <span class="font-bold block text-center">219</span>
                    </div>


                    <div class="w-full min-w-0 h-[200px] shadow-sm
                    rounded-[10px] overflow-hidden bg-white/40
                    transition-all duration-500 hover:scale-105">

                        <img src="image/moctail.jpg" alt="Mocktails"
                            class="rounded-[10px] h-[120px] w-full object-cover">

                        <h4 class="font-semibold text-[#262917]
                        text-sm sm:text-base text-center mt-2">
                            Mocktails
                        </h4>

                        <span class="font-bold block text-center">169</span>
                    </div>

                </div>
            </div>

        </div>



        <div class="w-full lg:w-[20%] flex flex-col
        items-center justify-center gap-5 p-3">

            <h2 class="text-2xl sm:text-3xl text-center
            font-semibold text-[#262917] animate-pulse">
                Good Food ♡
                <br>
                Good Mood
            </h2>

            <img src="image/coffe02.jpg" alt="Good Food Good Mood Coffee" class="w-full max-w-[300px] lg:max-w-full
            h-auto lg:h-[450px] object-cover rounded-[20px]
            shadow-lg transition-all duration-700
            hover:scale-105">

        </div>

    </section>

</body>

</html>
